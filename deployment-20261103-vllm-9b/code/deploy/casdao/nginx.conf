worker_processes 1;
pid /opt/disabled-appraisal/run/nginx.pid;
error_log /opt/disabled-appraisal/logs/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /opt/disabled-appraisal/logs/nginx-access.log;
    sendfile on;
    client_body_temp_path /opt/disabled-appraisal/run/client-body;
    proxy_temp_path /opt/disabled-appraisal/run/proxy;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_read_timeout 325s;
    proxy_send_timeout 325s;
    proxy_buffering off;
    proxy_set_header Host $host;

    server {
        # The pod interface and the loopback vLLM listener share port 8000.
        include /opt/disabled-appraisal/run/vllm-listen.conf;
        server_name _;
        location /v1/ { proxy_pass http://127.0.0.1:8000; }
        location / { return 404; }
    }

    server {
        listen 0.0.0.0:8080;
        server_name _;
        absolute_redirect off;
        root /opt/disabled-appraisal/current/dist;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location = / { return 302 /analyst.lintsing.net/; }
        location / { try_files $uri $uri/ =404; }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~ /\. { deny all; }

        location /api/ {
            proxy_pass https://127.0.0.1:3301;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /opt/disabled-appraisal/config/backend.crt;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # vLLM checks the caller's Bearer token. The frontend uses /api/ instead.
        location /v1/ {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
