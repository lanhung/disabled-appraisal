[program:appraisal-vllm]
command=/usr/local/bin/vllm serve --config /opt/disabled-appraisal/config/vllm.yaml
directory=/opt/disabled-appraisal
user=appraisal
environment=HOME="/opt/disabled-appraisal",XDG_CACHE_HOME="/opt/disabled-appraisal/cache",HF_HOME="/opt/disabled-appraisal/cache/huggingface",VLLM_CACHE_ROOT="/opt/disabled-appraisal/cache/vllm",TORCHINDUCTOR_CACHE_DIR="/opt/disabled-appraisal/cache/torchinductor",OMP_NUM_THREADS="4",VLLM_NO_USAGE_STATS="1",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1"
autostart=true
autorestart=unexpected
startsecs=20
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/opt/disabled-appraisal/logs/vllm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:appraisal-backend]
command=/opt/disabled-appraisal/bin/node server.js
directory=/opt/disabled-appraisal/current/gemini
user=appraisal
environment=NODE_ENV="production",HOME="/opt/disabled-appraisal"
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/opt/disabled-appraisal/logs/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:appraisal-web]
command=/bin/sh /opt/disabled-appraisal/current/deploy/casdao/start-web.sh -g "daemon off;"
directory=/opt/disabled-appraisal
user=appraisal
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/opt/disabled-appraisal/logs/web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
